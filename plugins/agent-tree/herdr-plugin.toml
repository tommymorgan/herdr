id = "tommymorgan.agent-tree"
name = "Agent Tree"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Explorer-style workspace and tab tree rendered in the expanded sidebar."
platforms = ["linux", "macos"]

[[actions]]
id = "focus-tab"
title = "Focus tab"
command = ["python3", "agent_tree.py", "--focus-tab"]

[[actions]]
id = "open-workspace"
title = "Focus or collapse workspace"
command = ["python3", "agent_tree.py", "--open-workspace"]

[[ui]]
id = "tree"
surface = "sidebar"
command = ["python3", "agent_tree.py", "--rows"]
